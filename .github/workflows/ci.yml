# Daemon tests and the release guard on Windows and Linux, both gating. The desktop
# shell (desktop/, Tauri + Rust) is not built in CI; it is Windows only and needs
# the MSVC toolchain and WebView2.
#
# Dependencies come from requirements.lock (uv pip compile --universal, test extras
# included) so a run installs the same set every time; the package itself is an
# editable install on top, with no dependency resolution of its own.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: python -m pytest -q
      - run: python scripts/oss_scan.py
