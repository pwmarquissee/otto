# Daemon tests and the release guard. The desktop shell (desktop/, Tauri + Rust)
# is not built in CI; it is Windows only and needs the MSVC toolchain and WebView2.
#
# Windows is the platform Otto has run on (README, Status). The Linux job is there
# to show what breaks off Windows, not to gate: it may fail without failing the run.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/oss_scan.py
